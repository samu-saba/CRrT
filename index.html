<script>
        // Password semplici per l'accesso alle sezioni
        const passwords = {
            'bassi': 'bassi',
            'tenori': 'tenori',
            'contralti': 'contralti',
            'soprani': 'soprani'
        };

        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const selectedSection = document.getElementById('section-select').value;
            const enteredPassword = document.getElementById('password-input').value.trim().toLowerCase();
            const errorDiv = document.getElementById('error-message');

            if (passwords[selectedSection] && passwords[selectedSection] === enteredPassword) {
                // Reindirizza al file con la struttura nomeSezione.index.html nella stessa cartella
                window.location.href = `${selectedSection}.index.html`;
            } else {
                errorDiv.style.display = 'block';
                document.getElementById('password-input').value = '';
            }
        });
    </script>
