<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Archivio Studio Coro - Accesso Sezioni</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            max-width: 450px; 
            margin: 80px auto; 
            padding: 20px; 
            background-color: #f7fafc; 
            color: #222222; 
        }
        .login-card { 
            background: #ffffff; 
            border: 1px solid #cbd5e0; 
            border-radius: 8px; 
            padding: 30px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); 
        }
        h1 { 
            color: #1a365d; 
            font-size: 1.6rem; 
            margin-top: 0; 
            text-align: center; 
        }
        p.subtitle { 
            text-align: center; 
            color: #555555; 
            font-size: 0.95rem; 
            margin-bottom: 25px; 
        }
        .form-group { 
            margin-bottom: 20px; 
        }
        label { 
            display: block; 
            font-weight: bold; 
            margin-bottom: 8px; 
            color: #1a365d; 
        }
        select, input[type="password"] { 
            width: 100%; 
            padding: 12px; 
            font-size: 1rem; 
            border: 1px solid #cbd5e0; 
            border-radius: 6px; 
            box-sizing: border-box; 
            outline: none;
        }
        select:focus, input[type="password"]:focus { 
            border-color: #1a365d; 
        }
        .btn-login { 
            width: 100%; 
            background-color: #1a365d; 
            color: #ffffff; 
            border: none; 
            padding: 12px; 
            font-size: 1rem; 
            font-weight: bold; 
            border-radius: 6px; 
            cursor: pointer; 
            transition: background 0.2s; 
        }
        .btn-login:hover { 
            background-color: #2c5282; 
        }
        .error-msg { 
            color: #c53030; 
            text-align: center; 
            margin-top: 15px; 
            font-size: 0.9rem; 
            font-weight: bold; 
            display: none; 
        }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>Archivio Studio Coro</h1>
        <p class="subtitle">Seleziona la tua sezione e inserisci la password d'accesso</p>
        
        <form id="login-form">
            <div class="form-group">
                <label for="section-select">Sezione Corale:</label>
                <select id="section-select" required>
                    <option value="" disabled selected>-- Scegli la tua sezione --</option>
                    <option value="bassi">Sezione Bassi</option>
                    <option value="tenori">Sezione Tenori</option>
                    <option value="contralti">Sezione Contralti</option>
                    <option value="soprani">Sezione Soprani</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="password-input">Password di Sezione:</label>
                <input type="password" id="password-input" placeholder="Inserisci la password..." required>
            </div>
            
            <button type="submit" class="btn-login">Accedi all'Archivio</button>
            <div id="error-message" class="error-msg">Password errata. Riprova.</div>
        </form>
    </div>

    <script>
        // Password semplici per l'accesso alle sezioni
        const passwords = {
            'bassi': 'bassi',
            'tenori': 'tenori',
            'contralti': 'contralti',
            'soprani': 'soprani'
        };

        document.getElementById('login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const selectedSection = document.getElementById('section-select').value;
            const enteredPassword = document.getElementById('password-input').value.trim().toLowerCase();
            const errorDiv = document.getElementById('error-message');

            if (passwords[selectedSection] && passwords[selectedSection] === enteredPassword) {
                // Reindirizza al file con la struttura nomeSezione.index.html nella stessa cartella
                window.location.href = `${selectedSection}.index.html`;
            } else {
                errorDiv.style.display = 'block';
                document.getElementById('password-input').value = '';
            }
        });
    </script>
</body>
</html>
